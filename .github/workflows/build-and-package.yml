name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamloicc/customer-api
  OCTOPUS_SERVER_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
  OCTOPUS_SPACE: Default
  VERSION: ${{ github.run_number }}

jobs:
  build-legacy-loan-processor:
    name: Build LegacyLoanProcessor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj
    
    - name: Build
      run: dotnet build src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --output ./publish/LegacyLoanProcessor
    
    - name: Package for Octopus
      run: |
        cd publish/LegacyLoanProcessor
        zip -r ../../LegacyLoanProcessor.${{ env.VERSION }}.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: legacy-loan-processor
        path: LegacyLoanProcessor.${{ env.VERSION }}.zip

  build-customer-api:
    name: Build CustomerApi Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.VERSION }}
          type=raw,value=latest
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: src/CustomerApi/CustomerApi
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  package-helm-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: build-customer-api
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
    
    - name: Update Helm values with image tag and Octopus variables
      run: |
        sed -i 's|tag: "latest"|tag: "${{ env.VERSION }}"|g' helm/customer-api/values.yaml
        sed -i 's|environment: "Development"|environment: "#{Octopus.Environment.Name}"|g' helm/customer-api/values.yaml
        sed -i 's|version: "1.0.0"|version: "#{Octopus.Release.Number}"|g' helm/customer-api/values.yaml
    
    - name: Package Helm chart
      run: |
        helm package helm/customer-api \
          --version ${{ env.VERSION }} \
          --app-version ${{ env.VERSION }} \
          --destination .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: customer-api-chart
        path: customer-api-chart-*.tgz
        retention-days: 30

  push-to-octopus:
    name: Push Packages to Octopus Deploy
    runs-on: ubuntu-latest
    needs: [build-legacy-loan-processor, build-customer-api, package-helm-chart]
    if: github.ref == 'refs/heads/main'
    env:
      OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: Default
    
    steps:
    - name: Download LegacyLoanProcessor artifact
      uses: actions/download-artifact@v4
      with:
        name: legacy-loan-processor
    
    - name: Download Helm chart artifact
      uses: actions/download-artifact@v4
      with:
        name: customer-api-chart
    
    - name: Install Octopus CLI
      uses: OctopusDeploy/install-octopus-cli-action@v3
    
    - name: Verify Octopus CLI Installation
      run: octopus version
    
    - name: Verify Authentication
      run: octopus space list
    
    - name: Push LegacyLoanProcessor to Octopus
      run: |
        octopus package upload \
          --file LegacyLoanProcessor.${{ github.run_number }}.zip \
          --space "${{ env.OCTOPUS_SPACE }}"
    
    - name: Push Helm chart to Octopus
      run: |
        octopus package upload \
          --file customer-api-chart-${{ github.run_number }}.tgz \
          --space "${{ env.OCTOPUS_SPACE }}"

  create-octopus-releases:
    name: Create and Deploy Octopus Releases
    runs-on: ubuntu-latest
    needs: push-to-octopus
    if: github.ref == 'refs/heads/main'
    env:
      OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: Default
    
    steps:
    - name: Install Octopus CLI
      uses: OctopusDeploy/install-octopus-cli-action@v3
    
    - name: Verify Octopus CLI Installation
      run: octopus version
    
    - name: Verify Authentication
      run: octopus space list
    
    - name: Create release for meridian - legacy
      run: |
        octopus release create \
          --project "meridian - legacy" \
          --version ${{ github.run_number }} \
          --space "${{ env.OCTOPUS_SPACE }}"
    
    - name: Deploy meridian - legacy to Development
      run: |
        octopus release deploy \
          --project "meridian - legacy" \
          --version ${{ github.run_number }} \
          --deployTo "Development" \
          --space "${{ env.OCTOPUS_SPACE }}"
    
    - name: Create release for meridian - customer api
      run: |
        octopus release create \
          --project "meridian - customer api" \
          --version ${{ github.run_number }} \
          --space "${{ env.OCTOPUS_SPACE }}"
    
    - name: Deploy meridian - customer api to Development
      run: |
        octopus release deploy \
          --project "meridian - customer api" \
          --version ${{ github.run_number }} \
          --deployTo "Development" \
          --space "${{ env.OCTOPUS_SPACE }}"
