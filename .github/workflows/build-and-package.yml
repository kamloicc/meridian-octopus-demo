name: Build and Package

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamloicc/customer-api
  OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
  OCTOPUS_SPACE: Default

jobs:
  build-legacy-loan-processor:
    name: Build LegacyLoanProcessor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj
    
    - name: Build
      run: dotnet build src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --output ./publish/LegacyLoanProcessor
    
    - name: Package for Octopus
      run: |
        cd publish/LegacyLoanProcessor
        zip -r ../../LegacyLoanProcessor.${{ github.run_number }}.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: legacy-loan-processor
        path: LegacyLoanProcessor.${{ github.run_number }}.zip

  build-customer-api:
    name: Build CustomerApi Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: src/CustomerApi/CustomerApi
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  package-helm-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: build-customer-api
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
    
    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0-build.${{ github.run_number }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Chart version: $VERSION"
    
    - name: Update Helm values with image tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          IMAGE_TAG=${GITHUB_REF#refs/tags/v}
        else
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
        fi
        sed -i "s|tag: \"latest\"|tag: \"${IMAGE_TAG}\"|g" helm/customer-api/values.yaml
    
    - name: Package Helm chart
      run: |
        helm package helm/customer-api \
          --version ${{ steps.version.outputs.VERSION }} \
          --app-version ${{ steps.version.outputs.VERSION }} \
          --destination .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: customer-api-chart
        path: customer-api-chart-*.tgz
        retention-days: 30
