name: Build and Package

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
  OCTOPUS_SPACE: Default

jobs:
  build-legacy-loan-processor:
    name: Build LegacyLoanProcessor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj
    
    - name: Build
      run: dotnet build src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish src/LegacyLoanProcessor/LegacyLoanProcessor/LegacyLoanProcessor.csproj --configuration Release --output ./publish/LegacyLoanProcessor
    
    - name: Package for Octopus
      run: |
        cd publish/LegacyLoanProcessor
        zip -r ../../LegacyLoanProcessor.${{ github.run_number }}.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: legacy-loan-processor
        path: LegacyLoanProcessor.${{ github.run_number }}.zip

  build-customer-api:
    name: Build CustomerApi Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: src/CustomerApi/CustomerApi
        push: true
        tags: |
          meridian/customer-api:latest
          meridian/customer-api:${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  package-helm-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
    
    - name: Package Helm chart
      run: |
        helm package helm/customer-api --version ${{ github.run_number }} --app-version ${{ github.run_number }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-chart
        path: customer-api-*.tgz
