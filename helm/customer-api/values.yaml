replicaCount: 2

image:
  repository: ghcr.io/kamloicc/customer-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Environment variables
env:
  environment: "Development"
  version: "1.0.0"

# Additional configuration
config:
  apiTitle: "Meridian Customer API"
  logLevel: "Information"
