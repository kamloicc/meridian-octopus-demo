apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
data:
  API_TITLE: {{ .Values.config.apiTitle | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OCTOPUS_ENVIRONMENT: {{ .Values.env.environment | quote }}
  OCTOPUS_VERSION: {{ .Values.env.version | quote }}
